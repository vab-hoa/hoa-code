<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 13px;
      padding: 18px 22px;
      color: #333;
      margin: 0;
    }
    label {
      display: block;
      margin-top: 14px;
      font-size: 11px;
      font-weight: bold;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    input[type=text], select {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 13px;
    }
    .hint { color: #888; font-size: 11px; margin-top: 3px; }
    .buttons { margin-top: 20px; text-align: right; }
    button {
      padding: 8px 18px;
      margin-left: 8px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }
    #btnOk     { background: #1a73e8; color: white; }
    #btnOk:hover { background: #1558b0; }
    #btnCancel { background: #f1f3f4; color: #333; }
    #status    { margin-top: 10px; min-height: 16px; font-size: 12px; color: #1a73e8; }
    .err       { color: #c0392b !important; }
  </style>
</head>
<body>

  <label>PDF filename</label>
  <input type="text" id="pdfName" value="<?= docName ?>">
  <div class="hint">Extension .pdf will be added automatically if omitted.</div>

  <label>Save to folder in Homeowner Docs</label>
  <select id="folder">
    <? for (var i = 0; i < folders.length; i++) { ?>
      <option value="<?= folders[i].id ?>"
        <? if (folders[i].id === suggestedId) { ?> selected <? } ?>>
        <?= folders[i].name ?>
      </option>
    <? } ?>
  </select>
  <div class="hint">
    <? if (suggested) { ?>
      Suggested based on this document's location in Board Documents.
    <? } else { ?>
      Location could not be determined automatically — please select.
    <? } ?>
  </div>

  <div class="buttons">
    <button id="btnCancel" onclick="google.script.host.close()">Cancel</button>
    <button id="btnOk" onclick="publish()">Publish PDF</button>
  </div>
  <div id="status"></div>

  <script>
    function publish() {
      var folderId = document.getElementById('folder').value;
      var pdfName  = document.getElementById('pdfName').value.trim();
      var status   = document.getElementById('status');
      if (!pdfName) {
        status.className = 'err';
        status.textContent = 'Please enter a filename.';
        return;
      }
      document.getElementById('btnOk').disabled     = true;
      document.getElementById('btnCancel').disabled = true;
      status.className   = '';
      status.textContent = 'Publishing — this may take a few seconds…';

      google.script.run
        .withSuccessHandler(function(name) {
          status.textContent = '✓ Published: ' + name;
          setTimeout(function() { google.script.host.close(); }, 2000);
        })
        .withFailureHandler(function(err) {
          status.className   = 'err';
          status.textContent = 'Error: ' + err.message;
          document.getElementById('btnOk').disabled     = false;
          document.getElementById('btnCancel').disabled = false;
        })
        .doPublish(folderId, pdfName);
    }
  </script>

</body>
</html>
