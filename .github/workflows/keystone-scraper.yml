name: Keystone Scraper

on:
  schedule:
    # 09:00 UTC = 3 AM MDT / 2 AM MST
    - cron: '0 9 * * *'
  workflow_dispatch:  # allow manual runs from GitHub Actions UI

# Never let two Keystone runs write the cache at the same time.
concurrency:
  group: keystone
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit last_run.txt (keeps repo active)

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd keystone-scraper
          pip install -r requirements.txt pytest

      - name: Write Google service account credentials
        run: |
          mkdir -p ~/.config/openclaw
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > ~/.config/openclaw/google-service-account.json

      - name: Unit tests
        run: |
          cd keystone-scraper
          python -m pytest -q tests

      - name: Sync Keystone data (CINC Connect API -> archive -> Keystone Cache)
        env:
          KEYSTONE_USERNAME: ${{ secrets.KEYSTONE_USERNAME }}
          KEYSTONE_PASSWORD: ${{ secrets.KEYSTONE_PASSWORD }}
        run: |
          cd keystone-scraper
          python keystone_sync.py

      - name: Reconcile Keystone status into the HOA tracker
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Copies Keystone status into work_items, closes items Keystone closed, assigns
          # WO numbers; refuses to run against an empty/short WorkOrders tab.
          python hoa-tracker/keystone_reconcile.py

      - name: Check Villas portal documents (copy new financials/minutes, alert on others)
        if: ${{ !cancelled() }}
        env:
          KEYSTONE_USERNAME: ${{ secrets.KEYSTONE_USERNAME }}
          KEYSTONE_PASSWORD: ${{ secrets.KEYSTONE_PASSWORD }}
        run: |
          cd keystone-scraper
          python keystone_documents.py
          # Commit the manifest now, so a later failing step can't make the next run
          # treat these files as new again.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystone_docs_manifest.json
          git diff --staged --quiet || git commit -m "chore: keystone documents manifest updated $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push

      - name: Import Keystone notes into the HOA tracker
        if: ${{ !cancelled() }}
        env:
          KEYSTONE_USERNAME: ${{ secrets.KEYSTONE_USERNAME }}
          KEYSTONE_PASSWORD: ${{ secrets.KEYSTONE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd keystone-scraper
          python keystone_notes.py

      - name: Import Keystone attachments into the HOA tracker
        if: ${{ !cancelled() }}
        env:
          KEYSTONE_USERNAME: ${{ secrets.KEYSTONE_USERNAME }}
          KEYSTONE_PASSWORD: ${{ secrets.KEYSTONE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd keystone-scraper
          python keystone_attachments.py
          # Remember identical copies skipped this run, so they're never re-downloaded.
          git add keystone_attachment_duplicates.json
          git diff --staged --quiet || git commit -m "chore: keystone attachment duplicates updated $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push

      # People and the per-street sheets are rebuilt by the Contacts sync workflow,
      # which runs an hour after this one. build_full_directory.py stays in the
      # repo for a manual refresh of the Full Directory tab.

      - name: Record successful run
        if: success()
        run: |
          echo "Last successful run: $(date -u '+%Y-%m-%d %H:%M UTC')" > keystone-scraper/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystone-scraper/last_run.txt
          git commit -m "chore: keystone scraper ran $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push

      - name: Email alert on failure
        if: failure()
        run: |
          cd keystone-scraper
          python notify.py "Keystone nightly sync FAILED" "The Keystone Scraper workflow failed on $(date -u '+%Y-%m-%d'). The Keystone Cache sheet was left as it was before this run.

          Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Common causes: Keystone password changed (update the KEYSTONE_PASSWORD secret), or Keystone changed their portal. See keystone-scraper/README.md."
