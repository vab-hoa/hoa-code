name: Keystone Scraper

on:
  schedule:
    # 09:00 UTC = 3 AM MDT / 2 AM MST
    - cron: '0 9 * * *'
  workflow_dispatch:  # allow manual runs from GitHub Actions UI

# Never let two Keystone runs write the cache at the same time.
concurrency:
  group: keystone
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit last_run.txt (keeps repo active)

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd keystone-scraper
          pip install -r requirements.txt pytest

      - name: Write Google service account credentials
        run: |
          mkdir -p ~/.config/openclaw
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > ~/.config/openclaw/google-service-account.json

      - name: Unit tests
        run: |
          cd keystone-scraper
          python -m pytest -q tests

      - name: Sync Keystone data (CINC Connect API -> archive -> Keystone Cache)
        env:
          KEYSTONE_USERNAME: ${{ secrets.KEYSTONE_USERNAME }}
          KEYSTONE_PASSWORD: ${{ secrets.KEYSTONE_PASSWORD }}
        run: |
          cd keystone-scraper
          python keystone_sync.py

      - name: Check Villas portal documents (copy new financials/minutes, alert on others)
        if: ${{ !cancelled() }}
        env:
          KEYSTONE_USERNAME: ${{ secrets.KEYSTONE_USERNAME }}
          KEYSTONE_PASSWORD: ${{ secrets.KEYSTONE_PASSWORD }}
        run: |
          cd keystone-scraper
          python keystone_documents.py
          # Commit the manifest now, so a later failing step can't make the next run
          # treat these files as new again.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystone_docs_manifest.json
          git diff --staged --quiet || (git commit -m "chore: keystone documents manifest updated $(date -u '+%Y-%m-%d')" && git push)

      # The directory steps don't use Keystone data (they read the Directory tab and
      # Google Contacts), so they run even if the Keystone sync failed.
      - name: Rebuild Full Directory
        if: ${{ !cancelled() }}
        run: |
          cd keystone-scraper
          python build_full_directory.py

      - name: Build per-street member directories
        if: ${{ !cancelled() }}
        run: |
          cd keystone-scraper
          python build_street_directories.py

      - name: Record successful run
        if: success()
        run: |
          echo "Last successful run: $(date -u '+%Y-%m-%d %H:%M UTC')" > keystone-scraper/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystone-scraper/last_run.txt
          git commit -m "chore: keystone scraper ran $(date -u '+%Y-%m-%d')"
          git push

      - name: Email alert on failure
        if: failure()
        run: |
          cd keystone-scraper
          python notify.py "Keystone nightly sync FAILED" "The Keystone Scraper workflow failed on $(date -u '+%Y-%m-%d'). The Keystone Cache sheet was left as it was before this run.

          Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Common causes: Keystone password changed (update the KEYSTONE_PASSWORD secret), or Keystone changed their portal. See keystone-scraper/README.md."
