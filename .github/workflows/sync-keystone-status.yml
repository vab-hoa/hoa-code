name: Sync Keystone Status

on:
  schedule:
    # 09:30 UTC = 3:30 AM MDT / 2:30 AM MST
    - cron: '30 9 * * *'  # UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate ARC serials (retroactive)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-arc-serials.cjs

      # The former "Sync Keystone status" step (scripts/sync-keystone-status.cjs) was removed
      # 2026-10-31: it read sheet tabs that don't exist ('Work Orders', 'ARC Review'), so it
      # silently did nothing, and fixing it would create a second writer of
      # work_items.keystone_status. hoa-tracker/keystone_reconcile.py is the single writer.

      - name: Report status
        if: always()
        run: |
          echo "Keystone sync completed"
          echo "Check logs for details"
