name: Work Order Schedule

on:
  schedule:
    # 7 AM MDT (13:00 UTC) — matches previous oregano cron schedule
    - cron: '0 13 * * *'
  workflow_dispatch:  # allow manual runs from GitHub Actions UI

jobs:
  schedule:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd keystone-scraper
          pip install -r requirements.txt

      - name: Write Google service account credentials
        run: |
          mkdir -p ~/.config/openclaw
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > ~/.config/openclaw/google-service-account.json

      - name: Run work order schedule
        run: |
          cd keystone-scraper
          # Pass --force when triggered manually so it always sends
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python work_order_schedule.py --force
          else
            python work_order_schedule.py
          fi
