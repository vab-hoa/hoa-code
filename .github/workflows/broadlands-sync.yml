name: Broadlands Document Sync

on:
  schedule:
    # Mondays 10:30 UTC = 4:30 AM MDT / 3:30 AM MST
    - cron: '30 10 * * 1'
  workflow_dispatch:  # allow manual runs from GitHub Actions UI

# Shares the Keystone login with the nightly scraper; never run them at the same time.
concurrency:
  group: keystone
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit updated broadlands_manifest.json

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd keystone-scraper
          pip install -r requirements.txt pytest

      - name: Write Google service account credentials
        run: |
          mkdir -p ~/.config/openclaw
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > ~/.config/openclaw/google-service-account.json

      - name: Unit tests
        run: |
          cd keystone-scraper
          python -m pytest -q tests

      - name: Run Broadlands document sync
        env:
          KEYSTONE_USERNAME: ${{ secrets.KEYSTONE_USERNAME }}
          KEYSTONE_PASSWORD: ${{ secrets.KEYSTONE_PASSWORD }}
        run: |
          cd keystone-scraper
          python broadlands_docs.py

      - name: Commit updated manifest
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystone-scraper/broadlands_manifest.json
          git diff --staged --quiet || git commit -m "chore: broadlands manifest updated $(date -u '+%Y-%m-%d')"
          git push

      - name: Email alert on failure
        if: failure()
        run: |
          cd keystone-scraper
          python notify.py "Broadlands document sync FAILED" "The weekly Broadlands document sync failed on $(date -u '+%Y-%m-%d'). No Drive files were removed.

          Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Common causes: Keystone password changed (update the KEYSTONE_PASSWORD secret), or Keystone changed their portal. See keystone-scraper/README.md."
